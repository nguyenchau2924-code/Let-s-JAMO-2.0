<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff6fb">
<title>Let's JAMO 2.0 🌸</title>
<style>
:root{--ink:#51415f;--muted:#9585a1;--pink:#ffd5e5;--lav:#e4dcff;--mint:#d5f7eb;--yellow:#fff0b8;--paper:#fff8fc;--line:#f0dfed;--accent:#df6e9f;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,sans-serif}
button,select{font:inherit}
button{cursor:pointer;border:0;color:inherit}
button:disabled{cursor:not-allowed;opacity:.65}
button:focus-visible,select:focus-visible{outline:3px solid #b8a4ff;outline-offset:2px}
.wrap{max-width:900px;margin:auto;padding:0 17px 40px}
.hero{margin:0 -17px 20px;padding:25px 21px 28px;border-radius:0 0 32px 32px;background:linear-gradient(120deg,#f4c8e6,#dcd7ff 55%,#d0f5e8)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-size:clamp(25px,5vw,38px);font-weight:1000;letter-spacing:-1px}.brand span{color:#d6538b}
.lang{border:0;border-radius:14px;padding:11px 12px;background:#ffffffdf;color:var(--ink);font-weight:800}
.score-pill{background:#ffffffcc;border-radius:20px;padding:10px 13px;font-weight:900}
h1{font-size:clamp(27px,5.4vw,39px);line-height:1.18;margin:26px 0 7px}
.subtitle{margin:0;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 25px}
.stat{background:white;border:2px solid var(--line);border-radius:19px;padding:12px 6px;text-align:center;font-size:20px;font-weight:900}
.stat small{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-top:2px}
h2{font-size:23px;margin:22px 0 13px}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.game{min-height:140px;text-align:left;padding:18px 15px;border-radius:23px;box-shadow:0 5px 0 #eadce8;transition:transform .12s}
.game:active{transform:translateY(3px);box-shadow:0 2px 0 #eadce8}
.game .emoji{font-size:31px;display:block;margin-bottom:9px}
.game strong{display:block;font-size:18px;margin-bottom:4px}
.game small{font-size:13px}
.pink{background:var(--pink)}.lav{background:var(--lav)}.mint{background:var(--mint)}.yellow{background:var(--yellow)}
.panel{background:white;border:2px solid var(--line);border-radius:25px;padding:18px;margin-top:18px}
.hidden{display:none!important}
.row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}
.pill{border-radius:13px;background:#f5edf8;padding:8px 11px;font-size:13px;font-weight:850}
.progress{height:9px;border-radius:99px;background:#f0e5f1;overflow:hidden;margin:13px 0}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,#f2a7c5,#aa9aeb);transition:width .2s}
.prompt-label{text-align:center;color:var(--muted);font-weight:750;margin:18px 0 5px}
.question{text-align:center;font-size:clamp(36px,10vw,58px);font-weight:1000;line-height:1.18;margin:10px 0 8px;overflow-wrap:anywhere}
.pronounce{text-align:center;color:#9b8aa3;font-size:14px;min-height:22px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0 10px}
.answer{background:#faf6ff;border:2px solid #ece0f7;border-radius:16px;padding:14px 8px;min-height:58px;font-weight:800;font-size:16px;overflow-wrap:anywhere}
.answer.good{background:#ddf7e9;border-color:#77d2a7}
.answer.bad{background:#ffe2ea;border-color:#f09ab4}
.feedback{text-align:center;font-weight:850;min-height:28px;margin:12px 0 4px}
.explanation{text-align:center;color:var(--muted);font-size:13px;min-height:20px;margin:5px 0}
.primary{background:var(--accent);color:#fff;border-radius:15px;padding:13px 18px;font-weight:900}
.secondary{background:#f3edf9;color:var(--ink);border-radius:14px;padding:11px 14px;font-weight:800}
.next{width:100%;margin-top:10px}
.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.actions button{flex:1;min-width:115px}
.result{text-align:center}
.result-emoji{font-size:58px}
.result h2{margin:8px 0}
.result p{line-height:1.55}
.footer{text-align:center;color:#aa98b2;font-size:12px;padding:25px 5px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#51415f;color:white;padding:11px 17px;border-radius:14px;display:none;z-index:10;max-width:90%;text-align:center}
@media(min-width:650px){.wrap{padding-top:0}.hero{padding:30px 30px 33px;margin-bottom:22px}.games{grid-template-columns:repeat(4,minmax(0,1fr))}.game{min-height:165px}.game strong{font-size:17px}}
@media(max-width:370px){.games{gap:9px}.game{padding:15px 11px;min-height:130px}.game strong{font-size:16px}.stats{gap:6px}.stat{font-size:17px}.answers{gap:8px}.answer{font-size:14px;padding:11px 5px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
 <div class="top">
  <div class="brand">🎀 JAMO <span>POP!</span></div>
  <div class="top">
   <select id="language" class="lang" aria-label="Select language">
    <option value="vi">🇻🇳 Tiếng Việt</option>
    <option value="ko">🇰🇷 한국어</option>
    <option value="en">🇺🇸 English</option>
   </select>
   <div class="score-pill">⭐ <b id="headerScore">0</b></div>
  </div>
 </div>
 <h1 id="headline">한국어, 같이 놀자!</h1>
 <p class="subtitle" id="subtitle">Chơi một chút, giỏi tiếng Hàn hơn mỗi ngày 🌷</p>
</header>

<div class="stats">
 <div class="stat">⭐ <b id="score">0</b><small id="pointsLabel">Điểm</small></div>
 <div class="stat">🔥 <b id="combo">0</b><small id="comboLabel">Combo</small></div>
 <div class="stat">🏆 <b id="best">0</b><small id="bestLabel">Kỷ lục</small></div>
</div>

<section id="home">
 <h2 id="chooseTitle">💖 Chọn trò chơi</h2>
 <div class="games">
  <button class="game pink" data-mode="vocab"><span class="emoji">🧁</span><strong id="vocabTitle">Quiz từ vựng</strong><small id="vocabDesc">Chọn nghĩa đúng</small></button>
  <button class="game lav" data-mode="jamo"><span class="emoji">🔤</span><strong id="jamoTitle">POP Hangul</strong><small id="jamoDesc">Nhận diện chữ</small></button>
  <button class="game mint" data-mode="talk"><span class="emoji">💌</span><strong id="talkTitle">Câu giao tiếp</strong><small id="talkDesc">Tiếng Hàn hằng ngày</small></button>
  <button class="game yellow" data-mode="speed"><span class="emoji">⚡</span><strong id="speedTitle">Speed POP</strong><small id="speedDesc">Thử thách 60 giây</small></button>
 </div>
 <p class="footer" id="homeFooter">🌱 Tiến bộ mỗi ngày một chút!</p>
</section>

<section id="gamePanel" class="panel hidden">
 <div class="row">
  <button class="secondary" id="backButton">← Trang chủ</button>
  <span class="pill" id="roundPill">Câu 1/10</span>
  <span class="pill hidden" id="timerPill">⏱️ 60</span>
 </div>
 <div class="progress"><div id="progressBar"></div></div>
 <div class="prompt-label" id="promptLabel">Từ này có nghĩa là gì?</div>
 <div class="question" id="question">학교</div>
 <div class="pronounce" id="pronunciation">hak-gyo</div>
 <div class="answers" id="answers"></div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
 <div class="explanation" id="explanation"></div>
 <button class="primary next" id="nextButton" disabled>Tiếp theo →</button>
 <div class="actions">
  <button class="secondary" id="listenButton">🔊 Nghe phát âm</button>
  <button class="secondary" id="skipButton">⏭ Bỏ qua</button>
 </div>
</section>

<section id="resultPanel" class="panel result hidden">
 <div class="result-emoji" id="resultEmoji">🏆</div>
 <h2 id="resultTitle">Giỏi lắm!</h2>
 <p id="resultText"></p>
 <button class="primary" id="replayButton">Chơi lại ↻</button>
 <button class="secondary" id="resultHomeButton">Trang chủ</button>
</section>

<p class="footer" id="footer">작은 한 걸음, 큰 성장 🌱 · Mỗi ngày tiến bộ một chút!</p>
</div>
<div class="toast" id="toast" role="status"></div>

const $ = id => document.getElementById(id);
let lang="vi", currentMode="vocab", deck=[], index=0, score=0, combo=0, best=0, roundScore=0;
let locked=false, timerId=null, timeLeft=60, currentQuestion=null, speedCount=0;

function tr(key){return TEXT[lang][key] || TEXT.vi[key] || key}
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function safeNumber(value){const n=Number(value);return Number.isFinite(n)&&n>=0?n:0}
function loadSaved(){
 try{score=safeNumber(localStorage.getItem("jamo2_score"));best=safeNumber(localStorage.getItem("jamo2_best"))}catch(e){score=0;best=0}
 updateStats();
}
function saveStats(){try{localStorage.setItem("jamo2_score",String(score));localStorage.setItem("jamo2_best",String(best))}catch(e){}}
function updateStats(){$("score").textContent=score;$("headerScore").textContent=score;$("combo").textContent=combo;$("best").textContent=best}
function applyLanguage(){
 lang=$("language").value;
 document.documentElement.lang=lang;
 $("headline").textContent=tr("headline");$("subtitle").textContent=tr("subtitle");
 $("pointsLabel").textContent=tr("points");$("comboLabel").textContent=tr("combo");$("bestLabel").textContent=tr("best");
 $("chooseTitle").textContent=tr("choose");$("vocabTitle").textContent=tr("vocab");$("vocabDesc").textContent=tr("vocabDesc");
 $("jamoTitle").textContent=tr("jamo");$("jamoDesc").textContent=tr("jamoDesc");$("talkTitle").textContent=tr("talk");$("talkDesc").textContent=tr("talkDesc");
 $("speedTitle").textContent=tr("speed");$("speedDesc").textContent=tr("speedDesc");$("homeFooter").textContent=tr("homeHint");$("footer").textContent=tr("footer");
 $("backButton").textContent=tr("back");$("listenButton").textContent=tr("listen");$("skipButton").textContent=tr("skip");
 if(!$("gamePanel").classList.contains("hidden") && currentQuestion)renderCurrentQuestion();
}
function categoryData(mode){if(mode==="vocab")return vocab;if(mode==="jamo")return jamo;if(mode==="talk")return talk;return [...vocab,...jamo,...talk]}
function startGame(mode){
 clearInterval(timerId);currentMode=mode;index=0;combo=0;roundScore=0;speedCount=0;locked=false;timeLeft=60;
 deck=shuffle(categoryData(mode));
 $("home").classList.add("hidden");$("resultPanel").classList.add("hidden");$("gamePanel").classList.remove("hidden");
 $("timerPill").classList.toggle("hidden",mode!=="speed");
 if(mode==="speed"){updateTimerLabel();timerId=setInterval(()=>{timeLeft-=1;updateTimerLabel();if(timeLeft<=0)finishGame(true)},1000)}
 renderCurrentQuestion();window.scrollTo({top:0,behavior:"smooth"});
}
function updateTimerLabel(){$("timerPill").textContent="⏱️ "+Math.max(0,timeLeft)+"s"}
function modePrompt(){
 if(currentMode==="vocab")return tr("vocabPrompt");
 if(currentMode==="jamo")return tr("jamoPrompt");
 if(currentMode==="talk")return tr("talkPrompt");
 return tr("speedPrompt");
}
function renderCurrentQuestion(){
 if(!deck.length){finishGame(false);return}
 if(currentMode!=="speed" && index>=deck.length){finishGame(false);return}
 currentQuestion=deck[index%deck.length];locked=false;
 $("promptLabel").textContent=modePrompt();
 $("question").textContent=currentQuestion.prompt;
 $("pronunciation").textContent=currentQuestion.roman || "";
 $("roundPill").textContent=tr("round")+" "+(index+1)+(currentMode==="speed"?"":" "+tr("of")+" "+deck.length);
 $("progressBar").style.width=currentMode==="speed"?Math.min(100,(speedCount%10+1)*10)+"%":((index+1)/deck.length*100)+"%";
 $("feedback").textContent="";$("explanation").textContent="";
 $("nextButton").disabled=true;$("nextButton").textContent=(currentMode!=="speed"&&index===deck.length-1)?tr("finish"):tr("next");
 const choices=shuffle(currentQuestion.opts.map((option,i)=>({option,index:i})));
 $("answers").innerHTML="";
 choices.forEach(({option,index:optionIndex})=>{
  const button=document.createElement("button");button.type="button";button.className="answer";
  button.textContent=option[["vi","ko","en"].indexOf(lang)];
  button.addEventListener("click",()=>chooseAnswer(button,optionIndex));
  $("answers").appendChild(button);
 });
}
function chooseAnswer(button,chosenIndex){
 if(locked || !currentQuestion)return;
 locked=true;
 const isCorrect=chosenIndex===currentQuestion.correct;
 const buttons=[...$("answers").querySelectorAll("button")];
 buttons.forEach((b)=>{
  b.disabled=true;
  const answerIndex=currentQuestion.opts.findIndex(opt=>opt[["vi","ko","en"].indexOf(lang)]===b.textContent);
  if(answerIndex===currentQuestion.correct)b.classList.add("good");
 });
 if(isCorrect){
  score+=10;roundScore+=10;combo+=1;speedCount+=1;
  $("feedback").textContent=tr("correct");
  button.classList.add("good");
 }else{
  combo=0;speedCount+=1;button.classList.add("bad");
  const correct=currentQuestion.opts[currentQuestion.correct][["vi","ko","en"].indexOf(lang)];
  $("feedback").textContent=tr("wrong")+correct;
 }
 if(score>best)best=score;
 const explanation=currentQuestion.explain?.[["vi","ko","en"].indexOf(lang)] || "";
 $("explanation").textContent=explanation?tr("explain")+explanation:"";
 updateStats();saveStats();$("nextButton").disabled=false;
}
function skipQuestion(){
 if(locked)return;
 locked=true;combo=0;speedCount+=1;
 const correct=currentQuestion.opts[currentQuestion.correct][["vi","ko","en"].indexOf(lang)];
 $("feedback").textContent=tr("skipped")+correct;
 [...$("answers").querySelectorAll("button")].forEach(b=>{
  b.disabled=true;
  if(b.textContent===correct)b.classList.add("good");
 });
 $("nextButton").disabled=false;updateStats();
}
function nextQuestion(){
 if(!locked){showToast(tr("toast"));return}
 index+=1;
 if(currentMode!=="speed" && index>=deck.length){finishGame(false);return}
 if(currentMode==="speed" && index>=deck.length){deck=shuffle(categoryData("speed"));index=0}
 renderCurrentQuestion();
}
function finishGame(timeExpired){
 clearInterval(timerId);timerId=null;
 $("gamePanel").classList.add("hidden");$("resultPanel").classList.remove("hidden");
 $("resultTitle").textContent=timeExpired?tr("timeUp"):tr("great");
 $("resultEmoji").textContent=roundScore>=80?"🏆":roundScore>=40?"🌟":"🌸";
 const attempted=currentMode==="speed"?speedCount:Math.min(index+1,deck.length);
 const total=currentMode==="speed"?Math.max(1,attempted):deck.length;
 const accuracy=attempted?Math.round((roundScore/10)/attempted*100):0;
 $("resultText").textContent=tr("result")+" "+roundScore+" "+tr("pointsWord")+". "+tr("accuracy")+": "+accuracy+"%.";
 $("replayButton").textContent=tr("again");$("resultHomeButton").textContent=tr("home");
 window.scrollTo({top:0,behavior:"smooth"});
}
function goHome(){
 clearInterval(timerId);timerId=null;
 $("gamePanel").classList.add("hidden");$("resultPanel").classList.add("hidden");$("home").classList.remove("hidden");
 updateStats();window.scrollTo({top:0,behavior:"smooth"});
}
function speakCurrent(){
 if(!currentQuestion)return;
 if(!("speechSynthesis" in window)){showToast("Speech audio is not available in this browser.");return}
 window.speechSynthesis.cancel();
 const speech=new SpeechSynthesisUtterance(currentQuestion.prompt);speech.lang="ko-KR";speech.rate=.82;
 window.speechSynthesis.speak(speech);
}
function showToast(message){$("toast").textContent=message;$("toast").style.display="block";clearTimeout(showToast.timeout);showToast.timeout=setTimeout(()=>$("toast").style.display="none",2000)}

document.querySelectorAll("[data-mode]").forEach(button=>button.addEventListener("click",()=>startGame(button.dataset.mode)));
$("language").addEventListener("change",applyLanguage);
$("backButton").addEventListener("click",goHome);
$("nextButton").addEventListener("click",nextQuestion);
$("skipButton").addEventListener("click",skipQuestion);
$("listenButton").addEventListener("click",speakCurrent);
$("replayButton").addEventListener("click",()=>startGame(currentMode));
$("resultHomeButton").addEventListener("click",goHome);
loadSaved();applyLanguage();
</script>
</body>
</html>
